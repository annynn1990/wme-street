name: Deploy Pendragon Cycle public mirror to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # New commits supersede a stale mirror/deployment instead of waiting behind it.
  cancel-in-progress: true

jobs:
  mirror-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install HTTrack
        run: |
          sudo apt-get update
          sudo apt-get install -y httrack zip python3

      - name: Mirror public pages and static assets
        run: |
          mkdir -p mirror
          httrack "https://pendragoncycle.com/" \
            -O "$PWD/mirror" \
            "+*.pendragoncycle.com/*" \
            "+pendragoncycle.com/*" \
            "+*.datocms-assets.com/*" \
            "+*.mux.com/*" \
            "+*.typekit.net/*" \
            "+use.typekit.net/*" \
            "-*.mp4" "-*.m3u8" "-*.mpd" "-*.ts" \
            "-*google-analytics*" "-*googletagmanager*" \
            --robots=0 --depth=5 --ext-depth=2 --keep-alive --sockets=4 \
            --connection-per-second=2 --timeout=30 --retries=2 -v

      - name: Localize discovered public image assets
        run: |
          SITE_BASE_PATH="/wme-street/pendragoncycle.com" python3 scripts/prepare_pendragon_mirror.py "$PWD/mirror"
          test -f mirror/index.html
          test -f mirror/pendragoncycle.com/index.html

      - name: Force replacement logos at the exact deployed asset paths
        run: |
          set -euo pipefail
          install -D "Gemini_Generated_Image_c2psf0c2psf0c2ps-Photoroom.png" "mirror/pendragoncycle.com/images/logo/logo-gold.png"
          install -D "wme.png" "mirror/pendragoncycle.com/images/logo/brand-mark.png"
          cp "Gemini_Generated_Image_c2psf0c2psf0c2ps-Photoroom.png" "mirror/Gemini_Generated_Image_c2psf0c2psf0c2ps-Photoroom.png"
          cp "wme.png" "mirror/wme.png"
          test -s "mirror/pendragoncycle.com/images/logo/logo-gold.png"
          test -s "mirror/pendragoncycle.com/images/logo/brand-mark.png"
          echo "Replacement files deployed:"
          sha256sum "mirror/pendragoncycle.com/images/logo/logo-gold.png" "mirror/pendragoncycle.com/images/logo/brand-mark.png" "Gemini_Generated_Image_c2psf0c2psf0c2ps-Photoroom.png" "wme.png"

      - name: Normalize every logo reference to the correct Pages URL
        env:
          LOGO_BASE_PATH: /wme-street/pendragoncycle.com
          LOGO_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          root = Path("mirror/pendragoncycle.com")
          base = os.environ["LOGO_BASE_PATH"].rstrip("/")
          version = os.environ["LOGO_VERSION"][:12]
          replacements = {
              "logo-gold.png": f"{base}/images/logo/logo-gold.png?v={version}",
              "brand-mark.png": f"{base}/images/logo/brand-mark.png?v={version}",
          }
          extensions = {".html", ".htm", ".js", ".css", ".json", ".map", ".xml", ".svg"}
          totals = {name: 0 for name in replacements}
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              try:
                  original = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue
              updated = original
              for filename, target in replacements.items():
                  pattern = re.compile(r"""[^"'\\s<>]*?""" + re.escape(filename) + r"""(?:\\?[^"'\\s<>]*)?""")
                  updated, count = pattern.subn(target, updated)
                  totals[filename] += count
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
          for filename, total in totals.items():
              print(f"{filename}: normalized {total} references")
              if total == 0:
                  raise SystemExit(f"ERROR: No references found for {filename}")
          PY
          echo "Checking for duplicated logo prefixes..."
          if grep -R -n -E 'wme-street/pendragoncycle.com/wme-street/pendragoncycle.com|pendragoncycle.com//wme-street/pendragoncycle.com' mirror/pendragoncycle.com --include='*.html' --include='*.js' --include='*.css'; then
            echo "::error::Found malformed duplicated logo paths after normalization"
            exit 1
          fi

      - name: Prepare static hosting
        run: |
          touch mirror/.nojekyll
          printf '%s\n' 'This is a static mirror of publicly accessible pages and non-video assets.' > mirror/ARCHIVE-NOTES.txt
          printf '%s\n' 'Large video streams are not bundled and may still require an internet connection.' >> mirror/ARCHIVE-NOTES.txt
          echo "Mirror file count:"
          find mirror -type f | wc -l
          echo "Mirror disk usage:"
          du -sh mirror

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mirror

      - name: Deploy mirror
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify replacement logos from the public site
        env:
          PUBLIC_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "${PUBLIC_PAGES_URL}/pendragoncycle.com/images/logo/logo-gold.png?v=${GITHUB_SHA}" -o /tmp/logo-gold.png &&
               curl --fail --silent --show-error --location "${PUBLIC_PAGES_URL}/pendragoncycle.com/images/logo/brand-mark.png?v=${GITHUB_SHA}" -o /tmp/brand-mark.png; then
              break
            fi
            echo "Public image URLs not ready (attempt ${attempt}/12); retrying..."
            sleep 5
          done
          test -s /tmp/logo-gold.png
          test -s /tmp/brand-mark.png
          echo "Expected source image digests:"
          sha256sum Gemini_Generated_Image_c2psf0c2psf0c2ps-Photoroom.png wme.png
          echo "Public image response digests:"
          sha256sum /tmp/logo-gold.png /tmp/brand-mark.png
          cmp -s Gemini_Generated_Image_c2psf0c2psf0c2ps-Photoroom.png /tmp/logo-gold.png || {
            echo "::error::Public logo-gold.png does not match the replacement image."
            exit 1
          }
          cmp -s wme.png /tmp/brand-mark.png || {
            echo "::error::Public brand-mark.png does not match wme.png."
            exit 1
          }
          echo "Both published logo URLs return the exact replacement image files."
